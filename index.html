<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Finanzas Personales</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanzas JuanJo">
<meta name="theme-color" content="#240046">
<script>
  // Muestra cualquier error de JavaScript en pantalla, para poder depurar desde el celular sin consola.
  window.addEventListener("error", (e) => {
    const el = document.getElementById("login-error");
    if (el) el.textContent = "Error técnico: " + e.message;
  });
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll(".pie-anio").forEach(el => el.textContent = new Date().getFullYear());
  });
</script>
<script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
<script>
  // Respaldo: si el CDN principal (EE.UU.) falla, intenta el CDN alterno (Europa)
  if (typeof msal === 'undefined') {
    document.write(unescape("%3Cscript src='https://alcdn.msftauth.net/browser/2.35.0/js/msal-browser.min.js' type='text/javascript'%3E%3C/script%3E"));
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<style>
  :root{
    --azul:#240046; --azul-claro:#5A189A; --verde:#2e7d32; --rojo:#c62828;
    --fondo:#f4f6f8; --tarjeta:#ffffff; --texto:#1a1a1a; --texto-suave:#6b7280;
    --borde:#e2e5ea;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--fondo);color:var(--texto);}
  header{background:var(--azul);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}
  header h1{font-size:18px;margin:0;font-weight:600;}
  header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;}
  #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:24px;text-align:center;}
  #login-screen h2{color:var(--azul);}
  #login-screen button, .btn-primario{background:var(--azul-claro);color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
  #login-screen button:hover, .btn-primario:hover{background:var(--azul);}
  #app-screen{display:none;max-width:520px;margin:0 auto;padding-bottom:80px;}
  nav.tabs{display:flex;background:#fff;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:5;}
  nav.tabs button{flex:1;padding:14px;border:none;background:none;font-size:14px;font-weight:600;color:var(--texto-suave);border-bottom:3px solid transparent;}
  nav.tabs button.activo{color:var(--azul-claro);border-bottom-color:var(--azul-claro);}
  section.tab{display:none;padding:16px;}
  section.tab.activo{display:block;}
  .campo{margin-bottom:14px;}
  .campo label{display:block;font-size:13px;font-weight:600;color:var(--texto-suave);margin-bottom:5px;}
  .campo select, .campo input, .campo textarea{width:100%;padding:11px;border:1px solid var(--borde);border-radius:8px;font-size:15px;background:#fff;}
  .campo textarea{resize:vertical;min-height:50px;}
  .oculto{display:none !important;}
  #msg-registro{padding:10px;border-radius:8px;margin-bottom:12px;font-size:14px;display:none;}
  #msg-registro.ok{background:#e8f5e9;color:var(--verde);display:block;}
  #msg-registro.err{background:#fdecea;color:var(--rojo);display:block;}
  .tarjeta{background:var(--tarjeta);border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .tarjeta .etiqueta{font-size:12px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.03em;}
  .tarjeta .valor{font-size:26px;font-weight:700;margin-top:4px;}
  .valor.positivo{color:var(--verde);}
  .valor.negativo{color:var(--rojo);}
  .fila-cuenta{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--borde);font-size:14px;}
  .fila-cuenta:last-child{border-bottom:none;}
  .fila-cuenta .nombre{font-weight:600;}
  .fila-cuenta .saldo{font-weight:600;}
  .subtitulo{font-size:13px;color:var(--texto-suave);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.03em;text-align:center;font-weight:700;}
  .estado-carga{text-align:center;padding:30px;color:var(--texto-suave);}
  .refrescar{background:none;border:1px solid var(--borde);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--azul-claro);float:right;}
  .filtro-mes{display:flex;gap:8px;align-items:end;margin-bottom:8px;}
  .filtro-mes label{display:block;font-size:12px;color:var(--texto-suave);margin-bottom:4px;}
  .filtro-mes input, .filtro-mes select{padding:9px;border:1px solid var(--borde);border-radius:8px;font-size:14px;background:#fff;min-width:190px;}
  .btn-secundario{background:var(--azul-claro);color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .kpi-grid .tarjeta{margin-bottom:0;padding:12px;}
  .kpi-grid .valor{font-size:19px;}
  .kpi-grid .etiqueta{font-size:11px;}
  .barra-progreso{position:relative;height:22px;background:#eef1f4;border-radius:6px;overflow:hidden;margin:8px 0;}
  .barra-progreso .marca-transcurrido{position:absolute;top:0;bottom:0;width:2px;background:#374151;}
  .barra-progreso .relleno{height:100%;border-radius:6px;}
  .barra-progreso .relleno.ok{background:#66bb6a;}
  .barra-progreso .relleno.alerta{background:#ef5350;}
  .leyenda-barra{display:flex;justify-content:space-between;font-size:11px;color:var(--texto-suave);}
  .grupo-cuenta-titulo{font-size:13px;font-weight:700;color:var(--azul);margin:14px 0 4px;}
  #grafico-composicion, #grafico-distribucion-gastos, #grafico-distribucion-tipo{max-width:240px;margin:0 auto;display:block;}
  #grafico-tendencia-gastos{max-width:100%;margin:0 auto;display:block;}
  .contenedor-tendencia > div{height:320px;}
  .control-meses{margin-bottom:12px;}
  .control-meses label{font-size:12px;color:var(--texto-suave);display:block;margin-bottom:4px;}
  .control-meses input[type=range]{width:100%;accent-color:var(--azul-claro);}
  .fila-patrimonio{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .patrimonio-texto{flex:1;min-width:0;}
  .mini-grafico{cursor:pointer;border:1px solid var(--borde);border-radius:6px;}
  .mini-grafico:hover{background:rgba(0,0,0,.03);}
  .mini-patrimonio-cont{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;}
  .mini-patrimonio-titulo{font-size:9px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.02em;font-weight:600;}
  .pie-app{padding:18px 16px 10px;text-align:center;}
  .pie-linea{height:1px;background:linear-gradient(90deg,transparent,var(--borde) 20%,var(--borde) 80%,transparent);margin-bottom:10px;}
  .pie-app p{margin:0;font-size:11px;color:var(--texto-suave);letter-spacing:.02em;}
  .pie-app strong{color:var(--azul);font-weight:600;}
  .pie-icono-lobo{display:block;margin:10px auto 0;width:44px;height:auto;opacity:.5;}
  .login-icono-lobo{width:80px;height:auto;margin-top:26px;opacity:.6;}
  #login-screen .pie-app{position:static;margin-top:14px;}
  .toggle-vista{display:flex;gap:6px;margin-bottom:10px;}
  .toggle-btn{flex:1;padding:9px;border:1px solid var(--borde);border-radius:8px;background:#fff;font-size:13px;font-weight:600;color:var(--texto-suave);}
  .toggle-btn.activo{background:var(--azul-claro);color:#fff;border-color:var(--azul-claro);}
  .acordeon{border:1px solid var(--borde);border-radius:10px;overflow:hidden;margin-bottom:10px;background:#fff;}
  .acordeon-header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:none;border:none;text-align:left;cursor:pointer;}
  .acordeon-header .titulo{font-weight:700;color:var(--azul);font-size:14px;}
  .acordeon-header .subtotal{font-size:13px;color:var(--texto-suave);margin-left:auto;margin-right:8px;text-align:right;}
  .acordeon-header .flecha{transition:transform .15s;color:var(--texto-suave);}
  .acordeon-header.abierto .flecha{transform:rotate(180deg);}
  .barra-grupo-cont{height:4px;background:#eef1f4;margin:0 14px 4px;border-radius:2px;overflow:hidden;}
  .barra-grupo{height:100%;background:var(--azul-claro);}
  .acordeon-contenido{padding:0 14px;}
  .acordeon-contenido.oculto{display:none;}
  .acordeon-contenido .fila-cuenta{padding:9px 0;}
  table.tabla-datos{width:100%;border-collapse:collapse;font-size:13px;}
  table.tabla-datos th{text-align:center;font-size:11px;color:var(--texto-suave);text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--borde);}
  table.tabla-datos td{padding:8px 4px;border-bottom:1px solid var(--borde);}
  table.tabla-datos tr:last-child td{border-bottom:none;}
  table.tabla-datos td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .barra-mini{height:6px;background:#eef1f4;border-radius:3px;margin-top:4px;overflow:hidden;}
  .barra-mini .relleno-mini{height:100%;background:var(--azul-claro);}
  .semaforo-icono{font-size:14px;}
  .mov-item{padding:12px 0;border-bottom:1px solid var(--borde);}
  .mov-item:last-child{border-bottom:none;}
  .mov-top{display:flex;justify-content:space-between;align-items:center;}
  .mov-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em;}
  .mov-badge.Ingreso{background:#e8f5e9;color:var(--verde);}
  .mov-badge.Gasto{background:#fdecea;color:var(--rojo);}
  .mov-badge.Transferencia{background:#e3f2fd;color:#1565c0;}
  .mov-badge.CompraUSD, .mov-badge.VentaUSD{background:#fff3e0;color:#e65100;}
  .mov-badge.PagoDeuda{background:#f3e5f5;color:#6a1b9a;}
  .mov-badge.ActualizacionValor{background:#eceff1;color:#37474f;}
  .mov-monto{font-weight:700;font-size:15px;}
  .mov-detalle{font-size:12px;color:var(--texto-suave);margin-top:4px;}
  .mov-fecha{font-size:11px;color:var(--texto-suave);}
  /* ---- CDT: vencimientos ---- */
  .cdt-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--borde);}
  .cdt-item:last-child{border-bottom:none;}
  .cdt-icono{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cdt-icono.vigente{background:#e8f5e9;color:#2e7d32;}
  .cdt-icono.proximo{background:#fff8e1;color:#b26a00;}
  .cdt-icono.pronto{background:#fdecea;color:#c62828;}
  .cdt-icono.vencido{background:#eceff1;color:#37474f;}
  .cdt-icono.sinfecha{background:#eef1f4;color:#6b7280;}
  .cdt-info{flex:1;min-width:0;}
  .cdt-nombre{font-weight:600;font-size:14px;}
  .cdt-detalle{font-size:12px;color:var(--texto-suave);margin-top:2px;}
  .cdt-dias{text-align:right;flex-shrink:0;min-width:64px;}
  .cdt-dias .n{display:block;font-size:20px;font-weight:700;line-height:1.1;}
  .cdt-dias .u{display:block;font-size:11px;color:var(--texto-suave);}
  .cdt-dias .plazo{display:block;font-size:10px;color:var(--texto-suave);margin-top:2px;}
  .cdt-dias.vigente .n{color:#2e7d32;}
  .cdt-dias.proximo .n{color:#b26a00;}
  .cdt-dias.pronto .n{color:#c62828;}
  .cdt-dias.vencido .n{color:#37474f;}
  /* ---- Proyección de gasto y tarjeta de crédito ---- */
  .proy-valor{font-size:26px;font-weight:700;margin-top:4px;}
  .proy-sub{font-size:12px;color:var(--texto-suave);margin-top:2px;}
  .proy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .proy-grid > div{background:#f7f8fa;border-radius:8px;padding:9px 10px;}
  .proy-grid .t{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.02em;}
  .proy-grid .v{font-size:15px;font-weight:700;margin-top:2px;}
  .proy-nota{font-size:12px;margin-top:10px;padding:9px 10px;border-radius:8px;background:#f7f8fa;color:var(--texto);}
  .proy-nota.alerta{background:#fdecea;color:#8e1b1b;}
  .proy-nota.ok{background:#e8f5e9;color:#1b5e20;}
  .proy-aviso{font-size:11px;color:var(--texto-suave);margin-top:8px;font-style:italic;}
  .tc-nombre{font-weight:700;font-size:14px;color:var(--azul);margin:2px 0 10px;}
  .tc-fechas{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tc-fecha{border-radius:10px;padding:10px;background:#f7f8fa;}
  .tc-fecha .t{font-size:11px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.02em;}
  .tc-fecha .f{font-size:14px;font-weight:700;margin-top:3px;}
  .tc-fecha .d{font-size:12px;margin-top:2px;font-weight:600;}
  .tc-fecha.vigente{background:#e8f5e9;} .tc-fecha.vigente .d{color:#2e7d32;}
  .tc-fecha.proximo{background:#fff8e1;} .tc-fecha.proximo .d{color:#b26a00;}
  .tc-fecha.pronto{background:#fdecea;}  .tc-fecha.pronto .d{color:#c62828;}
  .tc-fecha.neutro .d{color:var(--texto-suave);}
  .tc-lineas{margin-top:10px;}
  .tc-lineas .fila-cuenta{padding:7px 0;font-size:13px;}
  /* ---- Ritmo + proyección integrados en una sola tarjeta ---- */
  .barra-progreso .relleno{position:relative;z-index:1;}
  .barra-progreso .marca-transcurrido{z-index:2;}
  .barra-progreso .proy-fantasma{position:absolute;top:0;bottom:0;left:0;z-index:0;border-radius:6px;}
  .barra-progreso .proy-fantasma.ok{background:repeating-linear-gradient(45deg,#c8e6c9,#c8e6c9 4px,#e8f5e9 4px,#e8f5e9 8px);}
  .barra-progreso .proy-fantasma.alerta{background:repeating-linear-gradient(45deg,#ffcdd2,#ffcdd2 4px,#fdecea 4px,#fdecea 8px);}
  .leyenda-barra{flex-wrap:wrap;gap:2px 10px;}
  .leyenda-barra .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px;}
  .leyenda-barra .sw.ok{background:repeating-linear-gradient(45deg,#a5d6a7,#a5d6a7 2px,#e8f5e9 2px,#e8f5e9 4px);}
  .leyenda-barra .sw.alerta{background:repeating-linear-gradient(45deg,#ef9a9a,#ef9a9a 2px,#fdecea 2px,#fdecea 4px);}
  .proy-sep{height:1px;background:var(--borde);margin:14px 0 12px;}
  /* ---- Proyección desplegable ---- */
  .proy-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;border-top:1px solid var(--borde);margin-top:14px;padding:12px 0 0;cursor:pointer;font-size:13px;font-weight:700;color:var(--azul-claro);text-align:left;}
  .proy-toggle .flecha{transition:transform .15s;color:var(--texto-suave);}
  .proy-toggle.abierto .flecha{transform:rotate(180deg);}
  #proy-detalle{margin-top:10px;}
  /* ---- Selector de 3 vistas en Gastos ---- */
  .toggle-vista{gap:4px;}
  .toggle-btn{padding:9px 2px;font-size:12px;white-space:nowrap;}
  table.tabla-datos tr.fila-tipo-cat td{font-size:12px;color:var(--texto-suave);padding:4px 4px 4px 14px;border-bottom:none;}
  table.tabla-datos tr.fila-tipo-cat + tr:not(.fila-tipo-cat) td{border-top:1px solid var(--borde);}
  .punto-tipo{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;}
  /* ---- Dólares: equilibrio, simulador y cuentas ---- */
  .eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .eq-grid > div{background:#f7f8fa;border-radius:8px;padding:9px 8px;}
  .eq-grid .t{font-size:10px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.02em;}
  .eq-grid .v{font-size:14px;font-weight:700;margin-top:2px;}
  .eq-titular{font-size:15px;font-weight:700;margin-top:6px;line-height:1.3;}
  .eq-sub{font-size:12px;color:var(--texto-suave);margin-top:3px;}
  .sim-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .sim-chip{padding:6px 10px;border:1px solid var(--borde);border-radius:20px;background:#fff;font-size:12px;font-weight:600;color:var(--azul-claro);cursor:pointer;}
  .sim-chip:active{background:#f3e8fb;}
  .sim-res .fila-cuenta{padding:8px 0;font-size:13px;}
  .sim-res .destacado{font-weight:700;font-size:15px;}
  .usd-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borde);}
  .usd-item:last-child{border-bottom:none;}
  .usd-info{flex:1;min-width:0;}
  .usd-nombre{font-weight:600;font-size:14px;}
  .usd-tipo{font-size:11px;color:var(--texto-suave);margin-top:1px;}
  .usd-valores{text-align:right;flex-shrink:0;}
  .usd-valores .u{font-weight:700;font-size:14px;}
  .usd-valores .c{font-size:11px;color:var(--texto-suave);}
  /* ---- Historial: búsqueda y filtros ---- */
  .hist-barra{display:flex;gap:8px;margin-bottom:10px;}
  .hist-barra input{flex:1;min-width:0;padding:11px;border:1px solid var(--borde);border-radius:8px;font-size:15px;background:#fff;}
  .hist-btn-filtros{position:relative;padding:0 14px;border:1px solid var(--borde);border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:var(--azul-claro);cursor:pointer;white-space:nowrap;}
  .hist-btn-filtros.abierto{background:#f3e8fb;border-color:var(--azul-claro);}
  .hist-badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--azul-claro);color:#fff;font-size:11px;text-align:center;margin-left:6px;padding:0 5px;}
  .hist-panel{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .hist-grupo{margin-bottom:12px;}
  .hist-grupo:last-child{margin-bottom:0;}
  .hist-grupo > label{display:block;font-size:11px;font-weight:700;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
  .hist-grupo select, .hist-grupo input[type=date]{width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-size:14px;background:#fff;}
  .hist-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .hist-chip{padding:6px 11px;border:1px solid var(--borde);border-radius:20px;background:#fff;font-size:12px;font-weight:600;color:var(--texto);cursor:pointer;}
  .hist-chip.activo{background:var(--azul-claro);border-color:var(--azul-claro);color:#fff;}
  .hist-fechas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .hist-resumen{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--texto-suave);margin:2px 2px 8px;}
  .hist-resumen strong{color:var(--texto);}
  .hist-link{background:none;border:none;color:var(--azul-claro);font-size:12px;font-weight:700;cursor:pointer;padding:0;}
  .hist-mas{width:100%;margin-top:4px;padding:11px;border:1px solid var(--borde);border-radius:8px;background:#fff;color:var(--azul-claro);font-weight:700;font-size:13px;cursor:pointer;}
</style>
</head>
<body>

<div id="login-screen">
  <h2>Finanzas Personales</h2>
  <p>Inicia sesión con tu cuenta de Microsoft para registrar movimientos y consultar tu situación financiera.</p>
  <button id="btn-login">Iniciar sesión con Microsoft</button>
  <p id="login-error" style="color:#c62828;font-size:13px;margin-top:14px;"></p>
  <img src="wolf-icon.png" alt="" class="login-icono-lobo">
  <footer class="pie-app">
    <div class="pie-linea"></div>
    <p>Creado por <strong>Juan Cristancho</strong> · <span class="pie-anio"></span></p>
  </footer>
</div>

<div id="app-screen">
  <header>

<script>
// ================== CONFIGURACIÓN ==================
const msalConfig = {
  auth: {
    clientId: "ef5ac3c3-1563-413e-a0cf-8dbe19bd0d14",
    authority: "https://login.microsoftonline.com/common",
    redirectUri: "https://juanjocrim30.github.io/finanzas-app/"
  },
  cache: { cacheLocation: "sessionStorage" }
};
const NOMBRE_ARCHIVO = "Finanzas_Personales_JJ.xlsx";
const GRAPH = "https://graph.microsoft.com/v1.0";

let msalInstance;
try {
  if (typeof msal === "undefined") {
    throw new Error("La librería de Microsoft (MSAL) no cargó. Revisa tu conexión a internet o si algún bloqueador de anuncios está interfiriendo, y recarga la página.");
  }
  msalInstance = new msal.PublicClientApplication(msalConfig);
} catch (e) {
  document.getElementById("login-error").textContent = e.message;
  console.error(e);
}
let cuentaActiva = null;
let driveItemId = null;
let filtroMesInicializado = false;

// Caché en memoria de catálogos
let catCuentas = [], catCategorias = [], catSubcategorias = [], catDeudas = [];
let mapaCuentas = {}, mapaCategorias = {}, mapaSubcategorias = {};

// ================== AUTENTICACIÓN ==================
document.getElementById("btn-login").addEventListener("click", () => {
  document.getElementById("login-error").textContent = "";
  if (!msalInstance) {
    document.getElementById("login-error").textContent = "La app no cargó correctamente (ver mensaje arriba). Recarga la página.";
    return;
  }
  msalInstance.loginRedirect({ scopes: ["Files.ReadWrite"] });
});

document.getElementById("btn-logout").addEventListener("click", () => {
  msalInstance.logoutRedirect();
});

async function obtenerToken() {
  const cuentas = msalInstance.getAllAccounts();
  if (cuentas.length === 0) throw new Error("No hay sesión activa");
  const request = { scopes: ["Files.ReadWrite"], account: cuentas[0] };
  try {
    const resp = await msalInstance.acquireTokenSilent(request);
    return resp.accessToken;
  } catch (e) {
    await msalInstance.acquireTokenRedirect(request);
    // acquireTokenRedirect navega fuera de la página; el código después de esta línea no se ejecuta.
  }
}

async function graphFetch(path, options = {}) {
  const token = await obtenerToken();
  const resp = await fetch(GRAPH + path, {
    ...options,
    headers: {
      "Authorization": "Bearer " + token,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });
  if (!resp.ok) {
    const texto = await resp.text();
    throw new Error(`Graph API ${resp.status}: ${texto}`);
  }
  if (resp.status === 204) return null;
  return resp.json();
}

// ================== ARRANQUE DE LA APP ==================
async function iniciarApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  document.getElementById("f-fecha").value = new Date().toISOString().split("T")[0];

  try {
    // Intento 1: acceso directo por ruta (más rápido y confiable que la búsqueda)
    driveItemId = localStorage.getItem("driveItemId_" + NOMBRE_ARCHIVO) || null;
    if (driveItemId) {
      const valido = await graphFetch(`/me/drive/items/${driveItemId}`).catch(() => null);
      if (!valido) driveItemId = null;
    }

    if (!driveItemId) {
      const rutasCandidatas = [
        `/me/drive/root:/Documents/${NOMBRE_ARCHIVO}`,
        `/me/drive/root:/${NOMBRE_ARCHIVO}`
      ];
      for (const ruta of rutasCandidatas) {
        const item = await graphFetch(ruta).catch(() => null);
        if (item) { driveItemId = item.id; break; }
      }
    }

    if (!driveItemId) {
      // Último recurso: búsqueda (puede tardar en indexar archivos recién guardados)
      const busqueda = await graphFetch(`/me/drive/root/search(q='${NOMBRE_ARCHIVO}')`);
      if (!busqueda.value || busqueda.value.length === 0) {
        throw new Error(`No encontré "${NOMBRE_ARCHIVO}" en tu OneDrive (probé ruta directa y búsqueda). Verifica el nombre exacto y que esté sincronizado con OneDrive.`);
      }
      driveItemId = busqueda.value[0].id;
    }

    localStorage.setItem("driveItemId_" + NOMBRE_ARCHIVO, driveItemId);

    await Promise.all([cargarCuentas(), cargarCategorias(), cargarSubcategorias(), cargarDeudas()]);
    catCuentas.forEach(c => mapaCuentas[c.CuentaID] = c.Nombre);
    catCategorias.forEach(c => mapaCategorias[c.CategoriaID] = c.Nombre);
    catSubcategorias.forEach(c => mapaSubcategorias[c.SubcategoriaID] = c.Nombre);
    poblarSelects();
    actualizarVisibilidadCampos();
    await cargarConsulta();
  } catch (e) {
    mostrarMensajeRegistro("err", "Error al cargar datos: " + e.message);
    console.error(e);
  }
}

// ================== LECTURA DE CATÁLOGOS (por nombre de tabla) ==================
async function leerTabla(nombreTabla) {
  const headerResp = await graphFetch(`/me/drive/items/${driveItemId}/workbook/tables('${nombreTabla}')/headerRowRange`);
  const headers = headerResp.values[0].map(h => String(h).trim());
  const filasResp = await graphFetch(`/me/drive/items/${driveItemId}/workbook/tables('${nombreTabla}')/rows`);
  const filas = filasResp.value.map(r => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = r.values[0][i]);
    return obj;
  });
  return filas;
}

async function cargarCuentas() {
  const filas = await leerTabla("tbl_Cuentas");
  catCuentas = filas.filter(f => f.CuentaID && (f.Estado === "Activo" || !f.Estado));
}
async function cargarCategorias() {
  catCategorias = (await leerTabla("tbl_Categorias")).filter(f => f.CategoriaID);
}
async function cargarSubcategorias() {
  catSubcategorias = (await leerTabla("tbl_Subcategorias")).filter(f => f.SubcategoriaID);
}
async function cargarDeudas() {
  const filas = await leerTabla("tbl_Deudas");
  catDeudas = filas.filter(f => f.DeudaID && f.Estado === "Activa");
}

function poblarSelects() {
  const selDeuda = document.getElementById("f-deuda");
  catDeudas.forEach(d => {
    selDeuda.innerHTML += `<option value="${d.DeudaID}">${d.Nombre}</option>`;
  });
}

// Repuebla Cuenta origen / Cuenta destino / Categoría según el tipo de movimiento elegido
function actualizarOpcionesPorTipo(tipo) {
  const selOrigen = document.getElementById("f-origen");
  const selDestino = document.getElementById("f-destino");
  const selCategoria = document.getElementById("f-categoria");

  // Cuentas para "Cuenta origen": todas las activas (ActualizacionValor no usa este campo, se oculta)
  selOrigen.innerHTML = '<option value="">Selecciona...</option>';
  catCuentas.forEach(c => selOrigen.innerHTML += `<option value="${c.CuentaID}">${c.Nombre}</option>`);

  // Cuentas para "Cuenta destino": si es ActualizacionValor, solo cuentas con rendimiento pasivo
  // (Tyba, cuentas de alta rentabilidad, fondos) — las que realmente necesitas "chequear" cada mes.
  const cuentasDestino = tipo === "ActualizacionValor"
    ? catCuentas.filter(c => c.ComportamientoSaldo === "RendimientoPasivo")
    : catCuentas;
  selDestino.innerHTML = '<option value="">Selecciona...</option>';
  cuentasDestino.forEach(c => selDestino.innerHTML += `<option value="${c.CuentaID}">${c.Nombre}</option>`);

  // Categorías: solo las del tipo que corresponde (Gasto o Ingreso)
  selCategoria.innerHTML = '<option value="">Selecciona...</option>';
  catCategorias.filter(c => c.TipoCategoria === tipo).forEach(c => {
    selCategoria.innerHTML += `<option value="${c.CategoriaID}">${c.Nombre}</option>`;
  });
  actualizarSubcategorias();
}

function actualizarSubcategorias() {
  const catID = document.getElementById("f-categoria").value;
  const selSub = document.getElementById("f-subcategoria");
  selSub.innerHTML = '<option value="">Selecciona...</option>';
  catSubcategorias.filter(s => s.CategoriaID === catID).forEach(s => {
    selSub.innerHTML += `<option value="${s.SubcategoriaID}">${s.Nombre}</option>`;
  });
}
document.getElementById("f-categoria").addEventListener("change", actualizarSubcategorias);

// ================== FORMULARIO INTELIGENTE (mostrar/ocultar por tipo y moneda) ==================
function actualizarVisibilidadCampos() {
  const tipo = document.getElementById("f-tipo").value;
  const moneda = document.getElementById("f-moneda").value;
  const show = (id, cond) => document.getElementById(id).classList.toggle("oculto", !cond);
  show("c-origen", tipo !== "Ingreso" && tipo !== "ActualizacionValor" && tipo !== "");
  show("c-destino", tipo !== "Gasto" && tipo !== "PagoDeuda" && tipo !== "");
  // TRM: siempre para Compra/Venta de USD; además para Gasto/Ingreso cuando la moneda es USD
  // (para poder convertir ese movimiento a COP en los análisis, sin mezclar monedas).
  show("c-trm", tipo === "CompraUSD" || tipo === "VentaUSD" ||
                ((tipo === "Gasto" || tipo === "Ingreso") && moneda === "USD"));
  show("c-categoria", tipo === "Gasto" || tipo === "Ingreso");
  show("c-subcategoria", tipo === "Gasto");
  show("c-deuda", tipo === "PagoDeuda");
  actualizarOpcionesPorTipo(tipo);
}
document.getElementById("f-tipo").addEventListener("change", actualizarVisibilidadCampos);
document.getElementById("f-moneda").addEventListener("change", actualizarVisibilidadCampos);

// ================== VALIDACIÓN DEL FORMULARIO ==================
function validarFormulario(tipo) {
  const errores = [];
  const val = id => document.getElementById(id).value;
  const visible = id => !document.getElementById(id).classList.contains("oculto");

  if (!val("f-fecha")) errores.push("Fecha");
  if (!tipo) errores.push("Tipo de movimiento");
  const monto = parseFloat(val("f-monto"));
  if (isNaN(monto) || monto <= 0) errores.push("Monto (debe ser mayor a 0)");

  const chequear = (contId, inputId, etiqueta) => {
    if (visible(contId) && !val(inputId)) errores.push(etiqueta);
  };
  chequear("c-origen", "f-origen", "Cuenta origen");
  chequear("c-destino", "f-destino", "Cuenta destino");
  chequear("c-categoria", "f-categoria", "Categoría");
  chequear("c-subcategoria", "f-subcategoria", "Subcategoría");
  chequear("c-deuda", "f-deuda", "Deuda");

  if (visible("c-trm")) {
    const trm = parseFloat(val("f-trm"));
    if (isNaN(trm) || trm <= 0) errores.push("TRM de la operación (debe ser mayor a 0)");
  }
  return errores;
}

// ================== ENVÍO DEL FORMULARIO ==================
document.getElementById("form-movimiento").addEventListener("submit", async (e) => {
  e.preventDefault();
  const tipo = document.getElementById("f-tipo").value;

  const errores = validarFormulario(tipo);
  if (errores.length > 0) {
    mostrarMensajeRegistro("err", "Completa o corrige: " + errores.join(", "));
    return;
  }

  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  btn.textContent = "Guardando...";

  try {
    const val = id => { const v = document.getElementById(id).value; return v === "" ? null : v; };

    // Orden EXACTO de columnas de tbl_Movimientos (A a R).
    // null en las columnas con fórmula: Excel las calcula solo al insertar la fila.
    const fila = [
      null,                                   // A MovimientoID (fórmula)
      val("f-fecha"),                         // B Fecha
      tipo,                                   // C TipoMovimiento
      val("f-origen"),                        // D CuentaOrigen
      val("f-destino"),                       // E CuentaDestino
      parseFloat(val("f-monto")),             // F Monto
      val("f-moneda"),                        // G Moneda
      val("f-trm") ? parseFloat(val("f-trm")) : null, // H TRM_Operacion
      val("f-categoria"),                     // I CategoriaID
      val("f-subcategoria"),                  // J SubcategoriaID
      null,                                   // K ClasificacionGasto (fórmula)
      val("f-deuda"),                         // L DeudaID
      val("f-descripcion") || "",             // M Descripcion
      null, null, null, null,                 // N,O,P,Q (fórmulas)
      (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), // R RegistroID
      null, null                              // S,T MontoCOP / ImpactoDestinoCOP (fórmulas)
    ];

    await graphFetch(`/me/drive/items/${driveItemId}/workbook/tables('tbl_Movimientos')/rows/add`, {
      method: "POST",
      body: JSON.stringify({ values: [fila] })
    });

    mostrarMensajeRegistro("ok", "Movimiento registrado ✓");
    e.target.reset();
    document.getElementById("f-fecha").value = new Date().toISOString().split("T")[0];
    actualizarVisibilidadCampos();
  } catch (err) {
    mostrarMensajeRegistro("err", "No se pudo guardar: " + err.message);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Registrar movimiento";
  }
});

function mostrarMensajeRegistro(tipo, texto) {
  const el = document.getElementById("msg-registro");
  el.className = tipo;
  el.textContent = texto;
  setTimeout(() => { el.className = ""; el.textContent = ""; }, 6000);
}

// ================== TABS ==================
document.querySelectorAll("nav.tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("nav.tabs button").forEach(b => b.classList.remove("activo"));
    document.querySelectorAll("section.tab").forEach(s => s.classList.remove("activo"));
    btn.classList.add("activo");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("activo");
    if (btn.dataset.tab === "historial") cargarHistorial();
    if (btn.dataset.tab === "dolares") cargarDolares();
  });
});

// ================== TAB CONSULTAR ==================
function num(v) {
  if (v === null || v === undefined || v === "" || typeof v === "string") return null;
  return v;
}
function formatoMoneda(n) {
  n = num(n);
  if (n === null) return "—";
  return n.toLocaleString("es-CO", { maximumFractionDigits: 0 });
}
const ICONOS_SVG = {

  percent: '<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',

  dollar: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.5-1.3-2.5-3-2.5s-3 1-3 2.3 1.3 1.8 3 2.2 3 .9 3 2.5-1.3 2.5-3 2.5-3-1-3-2.5"/>',

};
function icono(nombre) {
  return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;opacity:0.7;">${ICONOS_SVG[nombre] || ""}</svg>`;
}
function formatoPorcentaje(n) {
  n = num(n);
  if (n === null) return "—";
  return (n * 100).toFixed(1) + "%";
}
const ORDEN_TIPO = ["Efectivo","Ahorros","CuentaRemunerada","CDT","FondoInversion","TarjetaCredito"];
function agruparCuentas(cuentas) {
  const grupos = {};
  cuentas.forEach(c => {
    const tipo = c.TipoCuenta || "Otro";
    if (!grupos[tipo]) grupos[tipo] = [];
    grupos[tipo].push(c);
  });
  const tipos = Object.keys(grupos).sort((a,b) => {
    const ia = ORDEN_TIPO.indexOf(a), ib = ORDEN_TIPO.indexOf(b);
    return (ia===-1?99:ia) - (ib===-1?99:ib);
  });
  return tipos.map(tipo => {
    const cuentasGrupo = grupos[tipo].slice().sort((a,b) => (num(b.SaldoActual)||0) - (num(a.SaldoActual)||0));
    const subtotales = {};
    cuentasGrupo.forEach(c => {
      const m = c.Moneda || "?";
      subtotales[m] = (subtotales[m] || 0) + (num(c.SaldoActual) || 0);
    });
    return { tipo, cuentas: cuentasGrupo, subtotales };
  });
}
function textoSubtotal(subtotales) {
  return Object.entries(subtotales).map(([m,v]) => `${formatoMoneda(v)} ${m}`).join(" + ");

function trmEnFecha(trmHistorica, fecha) {
  let mejor = null;
  for (const t of trmHistorica) {
    if (t._fecha && t._fecha <= fecha) {
      if (!mejor || t._fecha > mejor._fecha) mejor = t;
    }
  }
  return mejor ? num(mejor.TRM) : 0;
}

function patrimonioAFecha(fecha, cuentas, movimientos, deudas, trmHistorica) {
  let activosCOP = cuentas.filter(c => c.Moneda === "COP").reduce((s,c) => s + (num(c.SaldoInicial)||0), 0);
  let activosUSD = cuentas.filter(c => c.Moneda === "USD").reduce((s,c) => s + (num(c.SaldoInicial)||0), 0);

  movimientos.forEach(m => {
    if (!m._fecha || m._fecha > fecha) return;
    if (m.MonedaCuentaOrigen === "COP") activosCOP += (num(m.ImpactoOrigen)||0);
    if (m.MonedaCuentaOrigen === "USD") activosUSD += (num(m.ImpactoOrigen)||0);
    if (m.MonedaCuentaDestino === "COP") activosCOP += (num(m.ImpactoDestino)||0);
    if (m.MonedaCuentaDestino === "USD") activosUSD += (num(m.ImpactoDestino)||0);
  });

  const trm = trmEnFecha(trmHistorica, fecha) || 0;
  let deudaPendiente = 0;
  deudas.forEach(d => {
    if (d._fechaInicio && d._fechaInicio <= fecha) {
      const pagado = movimientos
        .filter(m => m._fecha && m._fecha <= fecha && m.TipoMovimiento === "PagoDeuda" && m.DeudaID === d.DeudaID)
        .reduce((s,m) => s + (num(m.Monto)||0), 0);
      deudaPendiente += (num(d.ValorTotalAPagar)||0) - pagado;
    }
  });

  return activosCOP + activosUSD*trm - deudaPendiente;
}

// Genera los N ultimos meses (fin de mes) contando hacia atras desde mesBaseStr ("YYYY-MM")
function ultimosMesesFin(mesBaseStr, cantidad) {
  const meses3 = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const [anio, mes] = mesBaseStr.split("-").map(v => parseInt(v, 10));
  const resultado = [];
  for (let i = cantidad - 1; i >= 0; i--) {
    const d = new Date(anio, mes - 1 - i + 1, 0); // dia 0 del mes siguiente = ultimo dia del mes objetivo
    resultado.push({ etiqueta: `${meses3[d.getMonth()]}-${String(d.getFullYear()).slice(-2)}`, fecha: d });
  }
  return resultado;
}

function diasHasta(fecha) {
  const h = new Date();
  const hoy = new Date(h.getFullYear(), h.getMonth(), h.getDate());
  return Math.round((fecha - hoy) / 86400000);
}
function plazoAproximado(dias) {
  if (dias < 60) return "";
  const meses = Math.round(dias / 30.44);
  if (meses < 12) return `≈ ${meses} meses`;
  const a = Math.floor(meses / 12), m = meses % 12;
  return `≈ ${a} año${a > 1 ? "s" : ""}${m ? ` y ${m} mes${m > 1 ? "es" : ""}` : ""}`;
}
function estadoCDT(dias) {
  if (dias === null) return { clase: "sinfecha", emoji: "⚪", texto: "Sin fecha" };
  if (dias < 0)  return { clase: "vencido", emoji: "⚫", texto: "Vencido" };
  if (dias <= 30) return { clase: "pronto",  emoji: "🔴", texto: "Vence pronto" };
  if (dias <= 90) return { clase: "proximo", emoji: "🟡", texto: "Próximo a vencer" };
  return { clase: "vigente", emoji: "🟢", texto: "Vigente" };
}

// ---------- Proyección de gasto a fin de mes ----------
function sumaMovGastoMes(movimientos, anio, mes) {
  let fijo = 0, variable = 0;
  movimientos.forEach(m => {
    if (m.TipoMovimiento !== "Gasto" || !m._fecha) return;
    if (m._fecha.getFullYear() !== anio || m._fecha.getMonth() !== mes - 1) return;
    const v = num(m.MontoCOP) ?? num(m.Monto) ?? 0;
    if (m.ClasificacionGasto === "Fijo") fijo += v; else variable += v;
  });
  return { fijo, variable };
}
function datosProyeccion(categorias, movimientos, mesStr, pct) {
  if (!mesStr || pct === null || pct <= 0) return null; // mes futuro: no hay nada que proyectar
  const [anio, mes] = String(mesStr).split("-").map(v => parseInt(v, 10));
  if (!anio || !mes) return null;
  const diasMes = new Date(anio, mes, 0).getDate();
  const presupuesto = categorias.reduce((s, c) => s + (c.presupuestado || 0), 0);
  const { fijo, variable } = sumaMovGastoMes(movimientos, anio, mes);
  const gasto = fijo + variable;
  if (pct >= 1) return { cerrado: true, gasto, presupuesto, proyeccion: gasto };

  const diasTrans = Math.max(1, Math.round(pct * diasMes));
  const diasRest = Math.max(0, diasMes - diasTrans);
  // Fijos: se toman tal cual (arriendo, suscripciones). Variables: se proyectan al ritmo actual.
  const proyeccion = fijo + variable / pct;
  return { cerrado: false, gasto, fijo, variable, presupuesto, proyeccion, diasTrans, diasRest,
           promVariable: variable / diasTrans, pct: presupuesto > 0 ? proyeccion / presupuesto : null };
}

// ---------- Tarjeta de crédito: corte y pago ----------
const TC_DIA_CORTE = 30;  // la tarjeta corta el día 30 de cada mes (en febrero, el último día)
const TC_DIA_PAGO  = 15;  // y el pago límite es el 15 del mes siguiente
function fechaDiaMes(anio, mes, dia) {
  // mes puede salir de rango (-1, 12): Date lo normaliza. Si el día no existe (30 de feb) usa el último del mes.
  const ult = new Date(anio, mes + 1, 0).getDate();
  return new Date(anio, mes, Math.min(dia, ult));
}
function proximaFechaDia(dia, hoy) {
  let f = fechaDiaMes(hoy.getFullYear(), hoy.getMonth(), dia);
  if (f < hoy) f = fechaDiaMes(hoy.getFullYear(), hoy.getMonth() + 1, dia);
  return f;
}
function ultimoCorte(hoy) {
  let f = fechaDiaMes(hoy.getFullYear(), hoy.getMonth(), TC_DIA_CORTE);
  if (f > hoy) f = fechaDiaMes(hoy.getFullYear(), hoy.getMonth() - 1, TC_DIA_CORTE);
  return f;
}
function textoDias(d) { return d === 0 ? "Es hoy" : d === 1 ? "Mañana" : `Faltan ${d} días`; }
function htmlTarjetasCredito(cuentas, movimientos, hoyRef) {
  const h0 = hoyRef || new Date();
  const hoy = new Date(h0.getFullYear(), h0.getMonth(), h0.getDate());
  const tarjetas = cuentas.filter(c => c.TipoCuenta === "TarjetaCredito" && (c.Estado === "Activo" || !c.Estado));
  if (tarjetas.length === 0) return "";

  const corte = proximaFechaDia(TC_DIA_CORTE, hoy);
  const pago = proximaFechaDia(TC_DIA_PAGO, hoy);
  const diasCorte = Math.round((corte - hoy) / 86400000);
  const diasPago = Math.round((pago - hoy) / 86400000);
  const ultCorte = ultimoCorte(hoy);
  const fmt = (d) => d.toLocaleDateString("es-CO", { day: "2-digit", month: "short", year: "numeric" });

  let html = `<div class="tarjeta"><div class="etiqueta">${icono("creditcard")}Tarjeta de crédito: corte y pago</div>`;
  tarjetas.forEach(c => {
    const saldo = num(c.SaldoActual) || 0;
    const deuda = Math.max(0, -saldo);
    const comprasCiclo = movimientos
      .filter(m => m.TipoMovimiento === "Gasto" && m.CuentaOrigen === c.CuentaID && m._fecha && m._fecha > ultCorte && m._fecha <= hoy)
      .reduce((s, m) => s + (num(m.MontoCOP) ?? num(m.Monto) ?? 0), 0);
    // Lo que ya está en extractos cerrados = deuda total menos lo comprado desde el último corte
    const extractoCerrado = Math.max(0, deuda - comprasCiclo);

    // Si el pago límite del último extracto ya pasó y aún hay saldo cerrado, está vencido
    const pagoUltExtracto = fechaDiaMes(ultCorte.getFullYear(), ultCorte.getMonth() + 1, TC_DIA_PAGO);
    const pagoVencido = extractoCerrado > 0 && pagoUltExtracto < hoy;
    const clasePago = pagoVencido ? "pronto" : extractoCerrado <= 0 ? "vigente" : diasPago <= 3 ? "pronto" : diasPago <= 7 ? "proximo" : "vigente";
    const claseCorte = diasCorte <= 3 ? "proximo" : "neutro";

    html += `<div class="tc-nombre">${c.Nombre}</div>
      <div class="tc-fechas">
        <div class="tc-fecha ${claseCorte}">
          <div class="t">${icono("calendar")}Próximo corte</div>
          <div class="f">${fmt(corte)}</div>
          <div class="d">${textoDias(diasCorte)}</div>
        </div>
        <div class="tc-fecha ${clasePago}">
          <div class="t">${icono("hourglass")}Pago límite</div>
          <div class="f">${fmt(pago)}</div>
          <div class="d">${textoDias(diasPago)}</div>
        </div>
      </div>
      <div class="tc-lineas">
        <div class="fila-cuenta"><span>Extracto cerrado el ${fmt(ultCorte)}</span><span class="saldo">${extractoCerrado > 0 ? formatoMoneda(extractoCerrado) : "Sin saldo por pagar"}</span></div>
        <div class="fila-cuenta"><span>Compras del ciclo en curso</span><span class="saldo">${formatoMoneda(comprasCiclo)}</span></div>
        <div class="fila-cuenta"><span>Deuda total de la tarjeta</span><span class="saldo">${saldo > 0 ? formatoMoneda(saldo) + " a favor" : formatoMoneda(deuda)}</span></div>
      </div>
      ${pagoVencido ? `<div class="proy-nota alerta">⚠️ El pago límite del extracto del ${fmt(ultCorte)} fue el ${fmt(pagoUltExtracto)} y aún figura saldo por pagar. Si ya pagaste, registra el pago como transferencia a la tarjeta.</div>` : ""}`;
  });
  html += `</div>`;
  return html;
}

async function cargarConsulta() {

    const [filasResumen, cuentas, deudasTodas, mesActual, filasPresupuesto, filasTendencia, movimientosCompletos, trmHistorica] = await Promise.all([

function dibujarGraficoDistribucionGastos(conGasto) {
  const canvas = document.getElementById("grafico-distribucion-gastos");
  if (!canvas) return; // no se dibuja si no hay gastos ese mes (no se insertó el canvas)
  if (typeof Chart === "undefined") return;
  if (typeof ChartDataLabels !== "undefined") Chart.register(ChartDataLabels);

  const total = conGasto.reduce((s,c) => s + c.real, 0);
  const paleta = ["#5A189A","#240046","#66bb6a","#ffa726","#ab47bc","#78909c","#ef5350","#26a69a","#8d6e63","#5c6bc0","#d4e157","#ff7043"];

  if (chartDistribucionGastos) chartDistribucionGastos.destroy();
  chartDistribucionGastos = new Chart(canvas, {
    type: "doughnut",
    data: {
      labels: conGasto.map(c => c.nombre),
      datasets: [{ data: conGasto.map(c => c.real), backgroundColor: paleta, borderWidth: 2, borderColor: "#fff" }]
    },
    options: {
      plugins: {
        legend: { position: "bottom", labels: { font: { size: 11 }, boxWidth: 12 } },
        datalabels: {
          color: "#fff", font: { weight: "bold", size: 10 },
          formatter: (v) => total > 0 ? (v/total*100).toFixed(0) + "%" : "",
          display: (ctx) => ctx.dataset.data[ctx.dataIndex] / total > 0.04 // oculta % en porciones muy pequeñas (se amontonan)
        },
        tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${formatoMoneda(ctx.raw)}` } }
      }
    }
  });
}

function formatoCorto(n) {
  if (n === null || n === undefined) return "";
  const signo = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1000000) return signo + (abs/1000000).toFixed(1).replace(/\.0$/,"") + "M";
  if (abs >= 1000) return signo + (abs/1000).toFixed(0) + "K";
  return signo + abs.toString();
}

function dibujarMiniPatrimonio(serie) {
  const canvas = document.getElementById("mini-patrimonio");
  if (!canvas || typeof Chart === "undefined") return;
  if (chartMiniPatrimonio) chartMiniPatrimonio.destroy();
  chartMiniPatrimonio = new Chart(canvas, {
    type: "line",
    data: {
      labels: serie.map(s => s.mes),
      datasets: [{ data: serie.map(s => s.valor), borderColor: "#1565C0", borderWidth: 2, pointRadius: 0, tension: 0.3, fill: false }]
    },
    options: {
      maintainAspectRatio: false,
      responsive: false,
      layout: { padding: 0 },
      plugins: { legend: { display: false }, tooltip: { enabled: false }, datalabels: { display: false } },
      scales: { x: { display: false }, y: { display: false } },
      elements: { line: { borderJoinStyle: "round" }, point: { radius: 0 } }
    }
  });
}

function dibujarGraficoEvolutivoPatrimonio(serie) {
  const canvas = document.getElementById("grafico-evolutivo-patrimonio");
  if (!canvas || typeof Chart === "undefined") return;
  if (typeof ChartDataLabels !== "undefined") Chart.register(ChartDataLabels);

  const variaciones = serie.map((s, i) => {
    if (i === 0) return null;
    const anterior = serie[i-1].valor;
    if (!anterior) return null;
    return (s.valor - anterior) / Math.abs(anterior) * 100;
  });

  if (chartEvolutivoPatrimonio) chartEvolutivoPatrimonio.destroy();
  chartEvolutivoPatrimonio = new Chart(canvas, {
    data: {
      labels: serie.map(s => s.mes),
      datasets: [
        {
          type: "bar",
          label: "Patrimonio neto",
          data: serie.map(s => s.valor),
          backgroundColor: serie.map(s => s.valor >= 0 ? "#240046" : "#c62828"),

function parsearFechaExcel(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") {
    // Excel: serie 0 = 1899-12-30. Extraemos año/mes/día en UTC (donde la aritmética de días es exacta)
    // y reconstruimos como fecha LOCAL con esos mismos números — así evitamos que la resta de horas
    // de la zona horaria (ej. Colombia UTC-5) recorra la fecha al día anterior al mostrarla.
    const utcDias = Math.round(v) - 25569;
    const fechaUTC = new Date(utcDias * 86400000);
    return new Date(fechaUTC.getUTCFullYear(), fechaUTC.getUTCMonth(), fechaUTC.getUTCDate());
  }
  // Para strings tipo "2026-09-01": los partimos a mano en vez de new Date(string), que los interpreta
  // como medianoche UTC y sufre el mismo corrimiento de un día en zonas horarias negativas.
  const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function formatoFechaCorta(d) {
  if (!d) return "";
  return d.toLocaleDateString("es-CO", { day: "numeric", month: "short", year: "numeric" });
}

// ---------- Dólares: equilibrio, simulador y cuentas en USD ----------
function conSigno(n) { return (n > 0 ? "+" : n < 0 ? "−" : "") + formatoMoneda(Math.abs(n)); }
function pctConSigno(x) {
  const r = Math.round(Math.abs(x) * 1000) / 10;   // un decimal; evita "−0%"
  return (r === 0 ? "" : x > 0 ? "+" : "−") + r.toLocaleString("es-CO", { maximumFractionDigits: 1 }) + "%";
}
function colorSigno(n) { return n > 0 ? "var(--verde)" : n < 0 ? "var(--rojo)" : "var(--texto)"; }
function fmtUSD(n) { return n.toLocaleString("es-CO", { maximumFractionDigits: 2 }); }

function htmlEquilibrioUSD(costo, trm) {
  const cab = `<div class="etiqueta">${icono("percent")}¿Cuánto falta para quedar en cero?</div>`;
  if (!costo || !trm) return `<div class="tarjeta">${cab}<div class="eq-sub" style="margin-top:8px;">Aún no hay compras de dólares o TRM para calcularlo.</div></div>`;
  const brecha = costo - trm;            // >0: el dólar debe subir; <0: ya hay ganancia
  const pctVar = trm / costo - 1;        // ganancia/pérdida porcentual sobre tu costo promedio
  let titular, sub, color;
  if (brecha > 0) {
    color = "var(--rojo)";
    titular = `El dólar debe subir ${formatoMoneda(brecha)} (${pctConSigno(costo / trm - 1)}) para quedar en cero`;
    sub = `De ${formatoMoneda(trm)} a ${formatoMoneda(costo)}, tu costo promedio.`;
  } else {
    color = "var(--verde)";
    titular = `Estás en ganancia: el dólar puede bajar ${formatoMoneda(-brecha)} (${pctConSigno(costo / trm - 1)}) antes de entrar en pérdida`;
    sub = `Tu costo promedio es ${formatoMoneda(costo)} y la TRM está en ${formatoMoneda(trm)}.`;
  }
  const avance = Math.max(0, Math.min(trm / costo, 1)) * 100;
  return `<div class="tarjeta">${cab}
    <div class="eq-titular" style="color:${color};">${titular}</div>
    <div class="eq-sub">${sub}</div>
    <div class="barra-progreso" style="margin-top:12px;"><div class="relleno ${brecha > 0 ? "alerta" : "ok"}" style="width:${avance}%;"></div></div>
    <div class="leyenda-barra"><span>TRM hoy: ${formatoMoneda(trm)}</span><span>Equilibrio: ${formatoMoneda(costo)}</span></div>
    <div class="eq-grid">
      <div><div class="t">TRM equilibrio</div><div class="v">${formatoMoneda(costo)}</div></div>
      <div><div class="t">TRM de hoy</div><div class="v">${formatoMoneda(trm)}</div></div>
      <div><div class="t">Resultado</div><div class="v" style="color:${colorSigno(pctVar)};">${pctConSigno(pctVar)}</div></div>
    </div>
  </div>`;
}

function htmlSimuladorUSD(trm) {
  const inicial = trm ? Math.round(trm * 100) / 100 : "";
  return `<div class="tarjeta">
    <div class="etiqueta">${icono("trending")}Simulador: ¿y si la TRM llega a…?</div>
    <div class="campo" style="margin:10px 0;">
      <input type="number" id="sim-trm" inputmode="decimal" step="any" min="0" value="${inicial}" placeholder="TRM a simular">
    </div>
    <div class="sim-chips">
      <button type="button" class="sim-chip" data-sim="-0.10">−10%</button>
      <button type="button" class="sim-chip" data-sim="-0.05">−5%</button>
      <button type="button" class="sim-chip" data-sim="hoy">Hoy</button>
      <button type="button" class="sim-chip" data-sim="0.05">+5%</button>
      <button type="button" class="sim-chip" data-sim="0.10">+10%</button>
      <button type="button" class="sim-chip" data-sim="equilibrio">Equilibrio</button>
    </div>
    <div class="sim-res" id="sim-resultado"></div>
  </div>`;
}

function activarSimuladorUSD(costo, trm, saldoUSD) {
  const input = document.getElementById("sim-trm");
  const res = document.getElementById("sim-resultado");
  if (!input || !res) return;
  const calcular = () => {
    const t = parseFloat(String(input.value).replace(",", "."));
    if (!isFinite(t) || t <= 0) { res.innerHTML = `<div class="eq-sub">Escribe una TRM para simular.</div>`; return; }
    const valorSim = saldoUSD * t;
    const valorHoy = saldoUSD * trm;
    const cambio = valorSim - valorHoy;
    // La TRM del campo se redondea a 2 decimales: si coincide con el equilibrio, el resultado es 0
    const resultado = costo ? (Math.abs(t - costo) < 0.006 ? 0 : (t - costo) * saldoUSD) : null;
    res.innerHTML = `
      <div class="fila-cuenta"><span>Tus dólares</span><span class="saldo">${fmtUSD(saldoUSD)} USD</span></div>
      <div class="fila-cuenta"><span>Valdrían en COP</span><span class="saldo">${formatoMoneda(valorSim)}</span></div>
      <div class="fila-cuenta"><span>Cambio frente a hoy</span><span class="saldo" style="color:${colorSigno(cambio)};">${conSigno(cambio)}</span></div>
      ${resultado !== null ? `<div class="fila-cuenta destacado" style="border-top:2px solid var(--borde);"><span>Resultado vs. tu costo promedio</span>
        <span style="color:${colorSigno(resultado)};">${conSigno(resultado)} (${pctConSigno(resultado === 0 ? 0 : t / costo - 1)})</span></div>` : ""}`;
  };
  input.addEventListener("input", calcular);
  document.querySelectorAll(".sim-chip").forEach(btn => btn.addEventListener("click", () => {
    const v = btn.dataset.sim;
    let t = trm;
    if (v === "equilibrio") { if (!costo) return; t = costo; }
    else if (v !== "hoy") t = trm * (1 + parseFloat(v));
    input.value = Math.round(t * 100) / 100;
    calcular();
  }));
  calcular();
}

function htmlCuentasUSD(cuentas, trm) {
  const lista = cuentas
    .filter(c => c.Moneda === "USD" && (c.Estado === "Activo" || !c.Estado))

    .sort((a, b) => b.saldo - a.saldo);
  if (lista.length === 0) return "";
  const total = lista.reduce((s, x) => s + x.saldo, 0);
  let h = `<div class="subtitulo">Cuentas en dólares</div>
    <div class="acordeon">
      <button type="button" class="acordeon-header" data-idx="usd">
        <span class="titulo">${icono("dollar")}Mis cuentas en USD (${lista.length})</span>
        <span class="subtotal">${fmtUSD(total)} USD</span>
        <span class="flecha">▾</span>
      </button>
      <div class="acordeon-contenido oculto" id="acordeon-usd">`;
  lista.forEach(({ c, saldo }) => {
    const pct = total > 0 ? saldo / total * 100 : 0;
    h += `<div class="usd-item">
        <div class="usd-info">
          <div class="usd-nombre">${icono(ICONO_TIPO[c.TipoCuenta] || "wallet")}${c.Nombre}</div>

          <div class="barra-mini"><div class="relleno-mini" style="width:${pct}%;"></div></div>
        </div>
        <div class="usd-valores"><div class="u">${fmtUSD(saldo)} USD</div>${trm ? `<div class="c">≈ ${formatoMoneda(saldo * trm)} COP</div>` : ""}</div>
      </div>`;
  });
  h += `</div></div>`;
  return h;
}

async function cargarDolares() {
  const cont = document.getElementById("dolares-contenido");
  cont.innerHTML = '<div class="estado-carga">Cargando...</div>';
  try {
    const [movs, indicadores, cuentasTodas] = await Promise.all([
      leerTabla("tbl_Movimientos"),
      leerRangoDashboard("B16:B19"),  // B16 CostoPromedio, B17 TRM del día, B18 Saldo USD, B19 Ganancia/pérdida latente
      leerTabla("tbl_Cuentas")
    ]);
    const [costoPromedio, trmDia, saldoUSD, gananciaLatente] = indicadores.map(fila => num(fila[0]));

    const compras = movs.filter(m => m.TipoMovimiento === "CompraUSD" && m.Fecha);
    const ventas = movs.filter(m => m.TipoMovimiento === "VentaUSD" && m.Fecha);
    const operaciones = [...compras, ...ventas];
    operaciones.forEach(m => m._fecha = parsearFechaExcel(m.Fecha));
    operaciones.sort((a,b) => (b._fecha||0) - (a._fecha||0));

    const sumaComprado = compras.reduce((s,m) => s + (num(m.Monto)||0), 0);
    const totalVendido = ventas.reduce((s,m) => s + (num(m.Monto)||0), 0);
    const posicionNeta = sumaComprado - totalVendido;

    // Ganancias: rendimiento acumulado en cuentas USD (chequeos mensuales de valor, ej. CDT/fondos en dólares).
    // Esto explica buena parte de la diferencia entre "Posición neta" (solo compras y ventas) y "Saldo total"
    // (el saldo real de tus cuentas, que también crece por estos rendimientos, sin que tú compres más dólares).
    const ganancias = movs
      .filter(m => m.TipoMovimiento === "ActualizacionValor" && m.MonedaCuentaDestino === "USD")
      .reduce((s,m) => s + (num(m.ImpactoDestino)||0), 0);
    const saldoParaSim = saldoUSD !== null ? saldoUSD
      : cuentasTodas.filter(c => c.Moneda === "USD" && (c.Estado === "Activo" || !c.Estado)).reduce((s, c) => s + (num(c.SaldoActual) || 0), 0);
    const otrosMovimientos = saldoUSD !== null ? saldoUSD - posicionNeta - ganancias : null;

    let html = `
      <div class="kpi-grid">
        <div class="tarjeta"><div class="etiqueta">${icono("dollar")}Costo promedio compra</div><div class="valor">${formatoMoneda(costoPromedio)}</div></div>
        <div class="tarjeta"><div class="etiqueta">${icono("trending")}TRM del día</div><div class="valor">${formatoMoneda(trmDia)}</div></div>
        <div class="tarjeta"><div class="etiqueta">${icono("wallet")}Saldo total en USD</div><div class="valor">${saldoUSD!==null?saldoUSD.toLocaleString("es-CO",{maximumFractionDigits:2}):"—"}</div></div>
        <div class="tarjeta"><div class="etiqueta">${icono("percent")}Ganancia/pérdida latente</div><div class="valor ${gananciaLatente!==null && gananciaLatente<0?"negativo":"positivo"}">${formatoMoneda(gananciaLatente)}</div></div>
      </div>

      ${htmlEquilibrioUSD(costoPromedio, trmDia)}
      ${htmlSimuladorUSD(trmDia)}
      ${htmlCuentasUSD(cuentasTodas, trmDia)}

      <div class="subtitulo">Comprado vs. vendido (histórico)</div>
      <div class="tarjeta">
        <div class="fila-cuenta"><span class="nombre">Total comprado</span><span class="saldo">${sumaComprado.toLocaleString("es-CO",{maximumFractionDigits:2})} USD</span></div>
        <div class="fila-cuenta"><span class="nombre">Total vendido</span><span class="saldo">${totalVendido.toLocaleString("es-CO",{maximumFractionDigits:2})} USD</span></div>
        <div class="fila-cuenta"><span class="nombre">Posición neta (compras − ventas)</span><span class="saldo">${posicionNeta.toLocaleString("es-CO",{maximumFractionDigits:2})} USD</span></div>
        <div class="fila-cuenta"><span class="nombre">Ganancias (rendimiento en USD)</span><span class="saldo">${ganancias.toLocaleString("es-CO",{maximumFractionDigits:2})} USD</span></div>
        <div class="fila-cuenta" style="border-top:2px solid var(--borde);font-weight:700;"><span class="nombre">Saldo total en USD</span><span class="saldo">${saldoUSD!==null?saldoUSD.toLocaleString("es-CO",{maximumFractionDigits:2}):"—"} USD</span></div>
        ${otrosMovimientos !== null && Math.abs(otrosMovimientos) > 0.01 ? `<div class="fila-cuenta"><span class="nombre" style="font-size:11px;color:var(--texto-suave);">Diferencia sin explicar (gastos/ingresos directos en USD, saldo inicial, etc.)</span><span class="saldo" style="font-size:11px;color:var(--texto-suave);">${otrosMovimientos.toLocaleString("es-CO",{maximumFractionDigits:2})} USD</span></div>` : ""}
      </div>

      <div class="subtitulo">Historial de operaciones</div>
      <div class="tarjeta">`;
    if (operaciones.length === 0) {
      html += `<div class="fila-cuenta"><span>Sin compras ni ventas de USD registradas</span></div>`;
    } else {
      operaciones.forEach(m => {
        const esCompra = m.TipoMovimiento === "CompraUSD";
        html += `
          <div class="mov-item">
            <div class="mov-top">
              <span class="mov-badge ${esCompra?"Ingreso":"Gasto"}">${esCompra?"Compra":"Venta"}</span>
              <span class="mov-monto">${(num(m.Monto)||0).toLocaleString("es-CO",{maximumFractionDigits:2})} USD</span>
            </div>
            <div class="mov-detalle">TRM: ${formatoMoneda(m.TRM_Operacion)}</div>
            <div class="mov-fecha">${formatoFechaCorta(m._fecha)}</div>
          </div>`;
      });
    }
    html += `</div>`;

    cont.innerHTML = html;
    if (trmDia) activarSimuladorUSD(costoPromedio, trmDia, saldoParaSim);
    document.querySelectorAll("#dolares-contenido .acordeon-header").forEach(btn => {
      btn.addEventListener("click", () => {
        document.getElementById("acordeon-" + btn.dataset.idx).classList.toggle("oculto");
        btn.classList.toggle("abierto");
      });
    });
  } catch (e) {
    cont.innerHTML = `<div class="estado-carga" style="color:#c62828;">Error al cargar: ${e.message}</div>`;
    console.error(e);
  }
}

// ---------- Historial con búsqueda y filtros ----------
const HIST_PAGINA = 20;
const HIST_ORDEN_TIPOS = ["Gasto", "Ingreso", "Transferencia", "PagoDeuda", "CompraUSD", "VentaUSD", "ActualizacionValor"];
function estadoHistInicial() { return { texto: "", tipos: new Set(), cuenta: "", categoria: "", periodo: "todo", desde: "", hasta: "", limite: HIST_PAGINA, panel: false }; }
let estadoHist = estadoHistInicial();
let movsHist = [];

function normTexto(t) { return String(t == null ? "" : t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function fechaDeInput(v) { if (!v) return null; const [a, m, d] = v.split("-").map(Number); return a ? new Date(a, m - 1, d) : null; }

function rangoPeriodoHist() {
  const h = new Date(), y = h.getFullYear(), m = h.getMonth(), d = h.getDate();
  switch (estadoHist.periodo) {
    case "mes":       return [new Date(y, m, 1), new Date(y, m + 1, 0)];
    case "mespasado": return [new Date(y, m - 1, 1), new Date(y, m, 0)];
    case "30":        return [new Date(y, m, d - 29), new Date(y, m, d)];
    case "anio":      return [new Date(y, 0, 1), new Date(y, 11, 31)];
    case "custom":    return [fechaDeInput(estadoHist.desde), fechaDeInput(estadoHist.hasta)];
    default:          return [null, null];
  }
}
function filtrosActivosHist() {
  return (estadoHist.tipos.size ? 1 : 0) + (estadoHist.cuenta ? 1 : 0) + (estadoHist.categoria ? 1 : 0) + (estadoHist.periodo !== "todo" ? 1 : 0);
}
function filtrarMovsHist() {
  const q = normTexto(estadoHist.texto).trim();
  const palabras = q ? q.split(/\s+/) : [];
  const [desde, hasta0] = rangoPeriodoHist();
  const hasta = hasta0 ? new Date(hasta0.getFullYear(), hasta0.getMonth(), hasta0.getDate(), 23, 59, 59, 999) : null;
  return movsHist.filter(f => {
    if (estadoHist.tipos.size && !estadoHist.tipos.has(f.TipoMovimiento)) return false;
    if (estadoHist.cuenta && f.CuentaOrigen !== estadoHist.cuenta && f.CuentaDestino !== estadoHist.cuenta) return false;
    if (estadoHist.categoria && f.CategoriaID !== estadoHist.categoria) return false;
    if (desde || hasta) {
      const fe = f._fechaParseada;
      if (!fe) return false;
      if (desde && fe < desde) return false;
      if (hasta && fe > hasta) return false;
    }
    return palabras.every(w => f._busqueda.includes(w)); // todas las palabras deben aparecer
  });
}

function htmlItemMov(f) {
  const esNegativo = f.TipoMovimiento === "Gasto" || f.TipoMovimiento === "PagoDeuda";
  return `
    <div class="mov-item">
      <div class="mov-top">
        <span class="mov-badge ${f.TipoMovimiento || ""}">${f.TipoMovimiento || "—"}</span>
        <span class="mov-monto ${esNegativo ? "negativo" : ""}">${esNegativo ? "-" : ""}${formatoMoneda(f.Monto)} ${f.Moneda || ""}</span>
      </div>
      <div class="mov-detalle">${f._detalle || "—"}</div>
      <div class="mov-fecha">${formatoFechaCorta(f._fechaParseada)}</div>
    </div>`;
}

function actualizarListaHist() {
  const lista = document.getElementById("hist-lista");
  const resumen = document.getElementById("hist-resumen");
  if (!lista || !resumen) return;
  const res = filtrarMovsHist();
  const hayFiltros = filtrosActivosHist() > 0 || estadoHist.texto.trim() !== "";

  let ingresos = 0, gastos = 0;
  res.forEach(f => {
    const v = num(f.MontoCOP) ?? num(f.Monto) ?? 0;
    if (f.TipoMovimiento === "Ingreso") ingresos += v;
    else if (f.TipoMovimiento === "Gasto") gastos += v;
  });
  const partes = [`<strong>${res.length}</strong> ${res.length === 1 ? "movimiento" : "movimientos"}`];
  if (ingresos > 0) partes.push(`Ingresos <strong style="color:var(--verde)">+${formatoMoneda(ingresos)}</strong>`);
  if (gastos > 0) partes.push(`Gastos <strong style="color:var(--rojo)">−${formatoMoneda(gastos)}</strong>`);
  resumen.innerHTML = `<span>${partes.join(" · ")}</span>${hayFiltros ? `<button type="button" class="hist-link" id="hist-limpiar">Limpiar filtros</button>` : ""}`;
  const lim = document.getElementById("hist-limpiar");
  if (lim) lim.addEventListener("click", () => { const panel = estadoHist.panel; estadoHist = estadoHistInicial(); estadoHist.panel = panel; renderControlesHist(); actualizarListaHist(); });

  if (res.length === 0) {
    lista.innerHTML = `<div class="tarjeta"><div class="estado-carga">Ningún movimiento coincide con los filtros.</div></div>`;
    return;
  }
  const visibles = res.slice(0, estadoHist.limite);
  let h = `<div class="tarjeta">${visibles.map(htmlItemMov).join("")}</div>`;
  if (res.length > visibles.length) h += `<button type="button" class="hist-mas" id="hist-mas">Ver más (${res.length - visibles.length} restantes)</button>`;
  lista.innerHTML = h;
  const mas = document.getElementById("hist-mas");
  if (mas) mas.addEventListener("click", () => { estadoHist.limite += HIST_PAGINA; actualizarListaHist(); });
}

function renderControlesHist() {
  const cont = document.getElementById("hist-controles");
  if (!cont) return;
  // Opciones según lo que realmente existe en los movimientos
  const tiposPresentes = [...new Set(movsHist.map(f => f.TipoMovimiento).filter(Boolean))]
    .sort((a, b) => (HIST_ORDEN_TIPOS.indexOf(a) + 1 || 99) - (HIST_ORDEN_TIPOS.indexOf(b) + 1 || 99));
  const idsCuentas = new Set();
  movsHist.forEach(f => { if (f.CuentaOrigen) idsCuentas.add(f.CuentaOrigen); if (f.CuentaDestino) idsCuentas.add(f.CuentaDestino); });
  const cuentasOpc = [...idsCuentas].map(id => [id, mapaCuentas[id] || id]).sort((a, b) => a[1].localeCompare(b[1], "es"));
  const idsCats = new Set(movsHist.map(f => f.CategoriaID).filter(Boolean));
  const catsOpc = [...idsCats].map(id => [id, mapaCategorias[id] || id]).sort((a, b) => a[1].localeCompare(b[1], "es"));
  if (estadoHist.cuenta && !idsCuentas.has(estadoHist.cuenta)) estadoHist.cuenta = "";
  if (estadoHist.categoria && !idsCats.has(estadoHist.categoria)) estadoHist.categoria = "";

  const periodos = [["todo", "Todo"], ["mes", "Este mes"], ["mespasado", "Mes pasado"], ["30", "Últimos 30 días"], ["anio", "Este año"], ["custom", "Personalizado"]];
  const n = filtrosActivosHist();
  cont.innerHTML = `
    <div class="hist-barra">
      <input type="search" id="hist-buscar" placeholder="Buscar movimientos…" value="${estadoHist.texto.replace(/"/g, "&quot;")}" autocomplete="off">
      <button type="button" class="hist-btn-filtros ${estadoHist.panel ? "abierto" : ""}" id="hist-btn-filtros">Filtros${n ? `<span class="hist-badge">${n}</span>` : ""}</button>
    </div>
    <div class="hist-panel ${estadoHist.panel ? "" : "oculto"}" id="hist-panel">
      <div class="hist-grupo"><label>Tipo de movimiento</label>
        <div class="hist-chips">${tiposPresentes.map(t => `<button type="button" class="hist-chip ${estadoHist.tipos.has(t) ? "activo" : ""}" data-tipo="${t}">${t}</button>`).join("")}</div>
      </div>
      <div class="hist-grupo"><label>Período</label>
        <select id="hist-periodo">${periodos.map(([v, t]) => `<option value="${v}" ${estadoHist.periodo === v ? "selected" : ""}>${t}</option>`).join("")}</select>
        <div class="hist-fechas ${estadoHist.periodo === "custom" ? "" : "oculto"}" id="hist-fechas">
          <input type="date" id="hist-desde" value="${estadoHist.desde}" aria-label="Desde">
          <input type="date" id="hist-hasta" value="${estadoHist.hasta}" aria-label="Hasta">
        </div>
      </div>
      <div class="hist-grupo"><label>Cuenta</label>
        <select id="hist-cuenta"><option value="">Todas las cuentas</option>${cuentasOpc.map(([id, nm]) => `<option value="${id}" ${estadoHist.cuenta === id ? "selected" : ""}>${nm}</option>`).join("")}</select>
      </div>
      <div class="hist-grupo"><label>Categoría</label>
        <select id="hist-categoria"><option value="">Todas las categorías</option>${catsOpc.map(([id, nm]) => `<option value="${id}" ${estadoHist.categoria === id ? "selected" : ""}>${nm}</option>`).join("")}</select>
      </div>
    </div>`;

  const refrescar = () => { estadoHist.limite = HIST_PAGINA; actualizarListaHist(); actualizarBadgeHist(); };
  let tBuscar = null;
  document.getElementById("hist-buscar").addEventListener("input", e => {
    clearTimeout(tBuscar);
    tBuscar = setTimeout(() => { estadoHist.texto = e.target.value; refrescar(); }, 150);
  });
  document.getElementById("hist-btn-filtros").addEventListener("click", () => {
    estadoHist.panel = !estadoHist.panel;
    document.getElementById("hist-panel").classList.toggle("oculto", !estadoHist.panel);
    document.getElementById("hist-btn-filtros").classList.toggle("abierto", estadoHist.panel);
  });
  cont.querySelectorAll(".hist-chip").forEach(b => b.addEventListener("click", () => {
    const t = b.dataset.tipo;
    if (estadoHist.tipos.has(t)) estadoHist.tipos.delete(t); else estadoHist.tipos.add(t);
    b.classList.toggle("activo", estadoHist.tipos.has(t));
    refrescar();
  }));
  document.getElementById("hist-periodo").addEventListener("change", e => {
    estadoHist.periodo = e.target.value;
    document.getElementById("hist-fechas").classList.toggle("oculto", estadoHist.periodo !== "custom");
    refrescar();
  });
  document.getElementById("hist-desde").addEventListener("change", e => { estadoHist.desde = e.target.value; refrescar(); });
  document.getElementById("hist-hasta").addEventListener("change", e => { estadoHist.hasta = e.target.value; refrescar(); });
  document.getElementById("hist-cuenta").addEventListener("change", e => { estadoHist.cuenta = e.target.value; refrescar(); });
  document.getElementById("hist-categoria").addEventListener("change", e => { estadoHist.categoria = e.target.value; refrescar(); });
}
function actualizarBadgeHist() {
  const btn = document.getElementById("hist-btn-filtros");
  if (!btn) return;
  const n = filtrosActivosHist();
  btn.innerHTML = `Filtros${n ? `<span class="hist-badge">${n}</span>` : ""}`;
}

async function cargarHistorial(conservarFiltros) {
  const cont = document.getElementById("historial-contenido");
  cont.innerHTML = '<div class="estado-carga">Cargando...</div>';
  try {
    const filas = (await leerTabla("tbl_Movimientos")).filter(f => f.Fecha);

    filas.forEach((f, i) => {
      f._fechaParseada = parsearFechaExcel(f.Fecha); f._orden = i;
      const nombreOrigen = mapaCuentas[f.CuentaOrigen] || f.CuentaOrigen || "";
      const nombreDestino = mapaCuentas[f.CuentaDestino] || f.CuentaDestino || "";
      const cuentasTexto = (nombreOrigen && nombreDestino) ? `${nombreOrigen} → ${nombreDestino}` : (nombreOrigen || nombreDestino || "");
      let categoriaTexto = "";
      if (f.SubcategoriaID) categoriaTexto = mapaSubcategorias[f.SubcategoriaID] || f.SubcategoriaID;
      else if (f.CategoriaID) categoriaTexto = mapaCategorias[f.CategoriaID] || f.CategoriaID;
      f._detalle = [cuentasTexto, categoriaTexto, f.Descripcion].filter(Boolean).join(" · ");
      // Texto en el que busca el cuadro de búsqueda (sin tildes ni mayúsculas)
      f._busqueda = normTexto([f.TipoMovimiento, nombreOrigen, nombreDestino, categoriaTexto, mapaCategorias[f.CategoriaID], f.Descripcion, f.Monto].filter(v => v != null && v !== "").join(" "));
    });
    filas.sort((a, b) => {
      const diffFecha = (b._fechaParseada || 0) - (a._fechaParseada || 0);
      if (diffFecha !== 0) return diffFecha;
      return b._orden - a._orden; // mismo día -> el registrado más tarde aparece primero
    });

    if (filas.length === 0) {
      cont.innerHTML = '<div class="estado-carga">Aún no has registrado movimientos.</div>';
      return;
    }
    movsHist = filas;
    if (!conservarFiltros) estadoHist = estadoHistInicial();
    estadoHist.limite = HIST_PAGINA;

    cont.innerHTML = '<div id="hist-controles"></div><div id="hist-resumen" class="hist-resumen"></div><div id="hist-lista"></div>';
    renderControlesHist();
    actualizarListaHist();
  } catch (e) {
    cont.innerHTML = `<div class="estado-carga" style="color:#c62828;">Error al cargar: ${e.message}</div>`;
    console.error(e);
  }
}
</script>
